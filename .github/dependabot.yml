# Dependabot configuration for Astroplate.
# Keeps npm/pnpm dependencies and GitHub Actions up to date with weekly PRs.
# Major version bumps (e.g. Astro 7 -> 8) are NOT grouped: they arrive as
# their own PRs so breaking changes can be reviewed separately.

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    groups:
      minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "workflows"
